<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Pokémon GO Fake -- Big Mode</title>

<style>

html, body {
  margin: 0;
  height: 100%;
  background: #111;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
  font-family: Arial;
}

#scene {
  position: relative;

  width: 80vw;
  height: 80vh;

  max-width: 700px;
  max-height: 900px;

  overflow: hidden;

  border-radius: 18px;

  background: black;
}

/* 🎥 cámara */
#camera {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 📡 scanlines */
#scanlines {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;

  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,255,0.05),
    rgba(0,255,255,0.05) 1px,
    transparent 2px,
    transparent 4px
  );

  mix-blend-mode: screen;
  opacity: 0.3;
}

/* 🌍 suelo falso */
#ground {
  position: absolute;
  width: 200%;
  height: 200%;
  left: -50%;
  top: 50%;

  background: radial-gradient(circle,
    rgba(0,255,255,0.08),
    transparent 60%
  );

  transform: perspective(800px) rotateX(65deg);

  pointer-events: none;
}

/* 💃 bailarín */
#dancer {
  position: absolute;

  width: 260px; /* 🔥 MÁS GRANDE POR DEFECTO */

  display: none;

  transform: translate(-50%, -50%) scale(1);

  pointer-events: none;

  filter:
    drop-shadow(0 0 10px cyan)
    drop-shadow(0 0 30px rgba(0,255,255,0.6));

  animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
  0% { opacity: 0.92; }
  100% { opacity: 1; }
}

/* 🌑 sombra */
#shadow {
  position: absolute;

  width: 140px;
  height: 35px;

  background: rgba(0,0,0,0.5);

  border-radius: 50%;

  filter: blur(10px);

  display: none;

  pointer-events: none;
}

/* 🔘 botón */
#btn {
  position: fixed;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  padding: 14px 20px;

  border: none;
  border-radius: 10px;

  background: rgba(0,0,0,0.85);
  color: white;

  cursor: pointer;
}

/* 📝 texto */
#info {
  position: fixed;

  top: 20px;
  width: 100%;

  text-align: center;

  color: white;

  font-size: 18px;

  text-shadow: 0 0 10px black;
}

</style>
</head>

<body>

<div id="scene">

  <video id="camera" autoplay muted playsinline></video>

  <div id="scanlines"></div>
  <div id="ground"></div>

  <div id="shadow"></div>

  <video id="dancer"
         src="dancer1.webm"
         loop
         muted
         playsinline></video>

</div>

<div id="info">📱 Click = colocar | Rueda = zoom</div>
<button id="btn">💃 Activar AR</button>

<audio id="music" src="music.mp3" loop></audio>

<script>

const scene = document.getElementById("scene")
const camera = document.getElementById("camera")
const dancer = document.getElementById("dancer")
const shadow = document.getElementById("shadow")
const btn = document.getElementById("btn")
const music = document.getElementById("music")

let wheelScale = 1

// 🎥 cámara trasera forzada
navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: { ideal: "environment" }
  },
  audio: false
})
.then(stream => {
  camera.srcObject = stream
  camera.play()
})
.catch(err => {
  console.log("camera error:", err)
})

// 💃 activar
btn.onclick = async () => {

  const rect = scene.getBoundingClientRect()

  setPosition(rect.width / 2, rect.height * 0.6)

  dancer.style.display = "block"
  shadow.style.display = "block"

  dancer.play().catch(()=>{})

  music.currentTime = 0
  music.play().catch(()=>{})

  btn.style.display = "none"
  info.style.display = "none"
}

// 📍 profundidad AR fake + escala grande
function setPosition(x, y) {

  const rect = scene.getBoundingClientRect()

  let depth = y / rect.height

  // 🔥 MÁS GRANDE AHORA
  let baseScale = 0.6 + Math.pow(depth, 1.5) * 4.0

  let finalScale = baseScale * wheelScale

  dancer.style.left = x + "px"
  dancer.style.top = y + "px"

  dancer.style.transform =
    `translate(-50%, -50%) scale(${finalScale})`

  shadow.style.left = x + "px"
  shadow.style.top = (y + 45) + "px"
}

// 📍 click coloca en suelo
scene.addEventListener("click", (e) => {

  const rect = scene.getBoundingClientRect()

  setPosition(
    e.clientX - rect.left,
    e.clientY - rect.top
  )
})

// 🔍 zoom PC (rueda)
scene.addEventListener("wheel", (e) => {

  e.preventDefault()

  wheelScale += e.deltaY * -0.001
  wheelScale = Math.min(Math.max(0.5, wheelScale), 4)

  const rect = scene.getBoundingClientRect()

  setPosition(
    parseFloat(dancer.style.left || rect.width/2),
    parseFloat(dancer.style.top || rect.height/2)
  )

}, { passive: false })

</script>

</body>
</html>
