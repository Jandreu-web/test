<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Bailarín + Música (Stable)</title>

<style>

html, body {
  margin: 0;
  height: 100%;
  background: #111;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
  font-family: Arial;
}

/* 📦 escena controlada */
#scene {
  position: relative;

  width: 80vw;
  height: 80vh;

  max-width: 700px;
  max-height: 900px;

  overflow: hidden;

  border-radius: 18px;

  background: black;
}

/* 🎥 cámara */
#camera {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

/* 💃 bailarín */
#dancer {
  position: absolute;

  width: 180px;

  display: none;

  transform: translate(-50%, -50%);

  pointer-events: none;

  filter:
    drop-shadow(0 0 10px cyan)
    drop-shadow(0 0 25px rgba(0,255,255,0.5));
}

/* 🌑 sombra */
#shadow {
  position: absolute;

  width: 120px;
  height: 30px;

  background: rgba(0,0,0,0.5);

  border-radius: 50%;

  filter: blur(12px);

  display: none;

  pointer-events: none;
}

/* 🔘 botón */
#btn {
  position: fixed;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  padding: 14px 20px;

  border: none;
  border-radius: 10px;

  background: rgba(0,0,0,0.85);
  color: white;

  cursor: pointer;
}

/* 📝 texto */
#info {
  position: fixed;

  top: 20px;
  width: 100%;

  text-align: center;

  color: white;

  font-size: 18px;

  text-shadow: 0 0 10px black;
}

</style>
</head>

<body>

<!-- 📦 escena -->
<div id="scene">

  <!-- 🎥 cámara -->
  <video id="camera" autoplay muted playsinline></video>

  <!-- 🌑 sombra -->
  <div id="shadow"></div>

  <!-- 💃 bailarín -->
  <video id="dancer"
         src="dancer1.webm"
         loop
         muted
         playsinline
         preload="auto">
  </video>

</div>

<!-- 📝 texto -->
<div id="info">📱 Pulsa para invocar el holograma</div>

<!-- 🔘 botón -->
<button id="btn">💃 Activar Bailarín</button>

<!-- 🎵 música -->
<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script>

const scene = document.getElementById("scene")
const camera = document.getElementById("camera")
const dancer = document.getElementById("dancer")
const shadow = document.getElementById("shadow")
const btn = document.getElementById("btn")
const info = document.getElementById("info")
const music = document.getElementById("music")

let scale = 1

// 🎥 cámara (automático)
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    camera.srcObject = stream
    camera.play()
  })
  .catch(err => console.log("camera error:", err))

// 💃 activar escena
btn.onclick = async () => {

  // 📍 centro inicial
  const rect = scene.getBoundingClientRect()

  const x = rect.width / 2
  const y = rect.height / 2

  dancer.style.left = x + "px"
  dancer.style.top = y + "px"

  shadow.style.left = x + "px"
  shadow.style.top = (y + 60) + "px"

  dancer.style.display = "block"
  shadow.style.display = "block"

  // 🎥 vídeo seguro
  dancer.play().catch(err => {
    console.log("video play error:", err)
  })

  // 🎵 música segura
  music.currentTime = 0
  music.play().catch(err => {
    console.log("audio play error:", err)
  })

  btn.style.display = "none"
  info.style.display = "none"
}

// 📍 click para mover
scene.addEventListener("click", (e) => {

  const rect = scene.getBoundingClientRect()

  const x = e.clientX - rect.left
  const y = e.clientY - rect.top

  dancer.style.left = x + "px"
  dancer.style.top = y + "px"

  shadow.style.left = x + "px"
  shadow.style.top = (y + 60) + "px"

})

// 🔍 zoom rueda
scene.addEventListener("wheel", (e) => {

  scale += e.deltaY * -0.001
  scale = Math.min(Math.max(0.5, scale), 3)

  dancer.style.transform = `translate(-50%, -50%) scale(${scale})`

})

</script>

</body>
</html>
