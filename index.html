<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Fake - Clean Object Zoom</title>

<style>

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial;
}

/* 🌍 escena full */
#scene {
  position: fixed;
  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;
}

/* 🎥 cámara */
#camera {
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}

/* 📡 overlay */
#scanlines {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;

  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,255,0.05),
    rgba(0,255,255,0.05) 1px,
    transparent 2px,
    transparent 4px
  );

  opacity: 0.3;
}

/* 💃 bailarín */
#dancer {
  position: absolute;

  width: 300px;

  display: none;

  transform: translate(-50%, -50%) scale(1);

  pointer-events: none;

  filter:
    drop-shadow(0 0 12px cyan)
    drop-shadow(0 0 35px rgba(0,255,255,0.6));

  animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
  0% { opacity: 0.92; }
  100% { opacity: 1; }
}

/* 🌑 sombra */
#shadow {
  position: absolute;

  width: 160px;
  height: 40px;

  background: rgba(0,0,0,0.5);

  border-radius: 50%;

  filter: blur(12px);

  display: none;

  pointer-events: none;
}

/* 🔘 botón */
#btn {
  position: fixed;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  padding: 14px 20px;

  border: none;
  border-radius: 10px;

  background: rgba(0,0,0,0.85);
  color: white;

  cursor: pointer;
}

/* 📝 info */
#info {
  position: fixed;

  top: 20px;
  width: 100%;

  text-align: center;

  color: white;

  font-size: 18px;

  text-shadow: 0 0 10px black;
}

</style>
</head>

<body>

<div id="scene">

  <video id="camera" autoplay muted playsinline></video>

  <div id="scanlines"></div>

  <div id="shadow"></div>

  <video id="dancer"
         src="dancer1.webm"
         loop
         muted
         playsinline></video>

</div>

<div id="info">📱 Click = colocar | Wheel / Pinch = zoom objeto</div>
<button id="btn">💃 Activar AR</button>

<audio id="music" src="music.mp3" loop></audio>

<script>

const scene = document.getElementById("scene")
const camera = document.getElementById("camera")
const dancer = document.getElementById("dancer")
const shadow = document.getElementById("shadow")
const btn = document.getElementById("btn")
const music = document.getElementById("music")

// 🧠 estado SEPARADO (clave del fix)
let dancerX = 0
let dancerY = 0
let dancerZoom = 1

// 🎥 cámara trasera
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment" },
  audio: false
})
.then(stream => {
  camera.srcObject = stream
  camera.play()
})
.catch(() => {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      camera.srcObject = stream
      camera.play()
    })
})

// 💃 activar
btn.onclick = async () => {

  const rect = scene.getBoundingClientRect()

  setPosition(rect.width / 2, rect.height * 0.6)

  dancer.style.display = "block"
  shadow.style.display = "block"

  dancer.play().catch(()=>{})

  music.currentTime = 0
  music.play().catch(()=>{})

  btn.style.display = "none"
  info.style.display = "none"
}

// 📍 SOLO guarda posición
function setPosition(x, y) {
  dancerX = x
  dancerY = y
  render()
}

// 🎯 render independiente (AR correcto)
function render() {

  const rect = scene.getBoundingClientRect()

  let depth = dancerY / rect.height

  let baseScale = 1.0 + Math.pow(depth, 1.7) * 5.0

  let finalScale = baseScale * dancerZoom

  dancer.style.left = dancerX + "px"
  dancer.style.top = dancerY + "px"

  dancer.style.transform =
    `translate(-50%, -50%) scale(${finalScale})`

  shadow.style.left = dancerX + "px"
  shadow.style.top = (dancerY + 50) + "px"
}

// 📍 click coloca objeto
scene.addEventListener("click", (e) => {

  const rect = scene.getBoundingClientRect()

  setPosition(
    e.clientX - rect.left,
    e.clientY - rect.top
  )
})

// 🖱️ zoom PC (SOLO objeto)
scene.addEventListener("wheel", (e) => {

  e.preventDefault()

  dancerZoom += e.deltaY * -0.001
  dancerZoom = Math.min(Math.max(0.5, dancerZoom), 6)

  render()

}, { passive: false })

// 📱 pinch (SOLO objeto)
let lastDist = null

scene.addEventListener("touchmove", (e) => {

  if (e.touches.length === 2) {

    e.preventDefault()

    const dx = e.touches[0].clientX - e.touches[1].clientX
    const dy = e.touches[0].clientY - e.touches[1].clientY

    const dist = Math.sqrt(dx*dx + dy*dy)

    if (lastDist !== null) {

      dancerZoom += (dist - lastDist) * 0.005
      dancerZoom = Math.min(Math.max(0.5, dancerZoom), 6)

      render()
    }

    lastDist = dist
  }

}, { passive: false })

scene.addEventListener("touchend", () => {
  lastDist = null
})

</script>

</body>
</html>
