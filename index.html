<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Pokémon GO Fake - Clean Zoom Fix</title>

<style>

html, body {
  margin: 0;
  height: 100%;
  background: #111;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
  font-family: Arial;
}

#scene {
  position: relative;

  width: 80vw;
  height: 80vh;

  max-width: 700px;
  max-height: 900px;

  overflow: hidden;

  border-radius: 18px;

  background: black;
}

/* 🎥 cámara (NO escala nunca) */
#camera {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 📡 scanlines */
#scanlines {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;

  background: repeating-linear-gradient(
    to bottom,
    rgba(0,255,255,0.05),
    rgba(0,255,255,0.05) 1px,
    transparent 2px,
    transparent 4px
  );

  mix-blend-mode: screen;
  opacity: 0.3;
}

/* 🌍 suelo falso */
#ground {
  position: absolute;
  width: 200%;
  height: 200%;
  left: -50%;
  top: 50%;

  background: radial-gradient(circle,
    rgba(0,255,255,0.08),
    transparent 60%
  );

  transform: perspective(800px) rotateX(65deg);

  pointer-events: none;
}

/* 💃 bailarín */
#dancer {
  position: absolute;

  width: 300px;

  display: none;

  transform: translate(-50%, -50%) scale(1);

  pointer-events: none;

  filter:
    drop-shadow(0 0 12px cyan)
    drop-shadow(0 0 35px rgba(0,255,255,0.6));

  animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
  0% { opacity: 0.92; }
  100% { opacity: 1; }
}

/* 🌑 sombra */
#shadow {
  position: absolute;

  width: 160px;
  height: 40px;

  background: rgba(0,0,0,0.5);

  border-radius: 50%;

  filter: blur(12px);

  display: none;

  pointer-events: none;
}

/* 🔘 botón */
#btn {
  position: fixed;

  bottom: 20px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  padding: 14px 20px;

  border: none;
  border-radius: 10px;

  background: rgba(0,0,0,0.85);
  color: white;

  cursor: pointer;
}

/* 📝 texto */
#info {
  position: fixed;

  top: 20px;
  width: 100%;

  text-align: center;

  color: white;

  font-size: 18px;

  text-shadow: 0 0 10px black;
}

</style>
</head>

<body>

<div id="scene">

  <video id="camera" autoplay muted playsinline></video>

  <div id="scanlines"></div>
  <div id="ground"></div>

  <div id="shadow"></div>

  <video id="dancer"
         src="dancer1.webm"
         loop
         muted
         playsinline></video>

</div>

<div id="info">📱 Click = colocar | Rueda = zoom bailarín</div>
<button id="btn">💃 Activar AR</button>

<audio id="music" src="music.mp3" loop></audio>

<script>

const scene = document.getElementById("scene")
const camera = document.getElementById("camera")
const dancer = document.getElementById("dancer")
const shadow = document.getElementById("shadow")
const btn = document.getElementById("btn")
const music = document.getElementById("music")

// 🧠 zoom SOLO del bailarín
let dancerZoom = 1

// 🎥 cámara trasera
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment" },
  audio: false
})
.then(stream => {
  camera.srcObject = stream
  camera.play()
})
.catch(() => {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      camera.srcObject = stream
      camera.play()
    })
})

// 💃 activar
btn.onclick = async () => {

  const rect = scene.getBoundingClientRect()

  setPosition(rect.width / 2, rect.height * 0.6)

  dancer.style.display = "block"
  shadow.style.display = "block"

  dancer.play().catch(()=>{})

  music.currentTime = 0
  music.play().catch(()=>{})

  btn.style.display = "none"
  info.style.display = "none"
}

// 📍 AR fake (profundidad)
function setPosition(x, y) {

  const rect = scene.getBoundingClientRect()

  let depth = y / rect.height

  // 🔥 escala base AR
  let baseScale = 1.0 + Math.pow(depth, 1.7) * 5.0

  // 🔥 SOLO aquí entra el zoom del usuario
  let finalScale = baseScale * dancerZoom

  dancer.style.left = x + "px"
  dancer.style.top = y + "px"

  dancer.style.transform =
    `translate(-50%, -50%) scale(${finalScale})`

  shadow.style.left = x + "px"
  shadow.style.top = (y + 50) + "px"
}

// 📍 click coloca bailarín
scene.addEventListener("click", (e) => {

  const rect = scene.getBoundingClientRect()

  setPosition(
    e.clientX - rect.left,
    e.clientY - rect.top
  )
})

// 🔍 zoom SOLO bailarín
scene.addEventListener("wheel", (e) => {

  e.preventDefault()

  dancerZoom += e.deltaY * -0.001

  dancerZoom = Math.min(Math.max(0.5, dancerZoom), 6)

  const rect = scene.getBoundingClientRect()

  setPosition(
    parseFloat(dancer.style.left || rect.width/2),
    parseFloat(dancer.style.top || rect.height/2)
  )

}, { passive: false })

</script>

</body>
</html>
